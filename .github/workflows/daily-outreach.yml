name: Daily Outreach Emails

on:
  schedule:
    - cron: '0 21 * * *'  # 7am AEST (UTC+10) every day
  workflow_dispatch:        # allow manual trigger from GitHub

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily outreach (2 accountants + 2 businesses)
        run: |
          curl -s -X POST "https://sabaccountai.com/api/agents/sab" \
            -H "Content-Type: application/json" \
            -H "x-agent-secret: ${{ secrets.AGENT_WEBHOOK_SECRET }}" \
            -d '{"trigger":"daily_outreach"}' | tee /tmp/result.json
          cat /tmp/result.json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          a = d.get('accountants', {})
          b = d.get('businesses', {})
          print(f'Accountants: {a.get(\"sent\",0)} sent — {a.get(\"names\",[])}')
          print(f'Businesses:  {b.get(\"sent\",0)} sent — {b.get(\"names\",[])}')
          print(f'Total: {d.get(\"totalSent\",0)} emails sent today')
          "
